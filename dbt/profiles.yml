# Profile used when dbt runs inside Snowflake (Workspaces / dbt project object).
# Snowflake runs dbt as the current session, so account, user and credentials
# are not used here. Local runs use ~/.dbt/profiles.yml instead (key-pair auth).
insurance_analytics:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: not_used
      user: not_used
      role: DEVELOPER
      warehouse: RLI_DEV_WH
      database: DEV_ANALYTICS
      schema: STAGING
      threads: 4

    prod:
      type: snowflake
      account: not_used
      user: not_used
      role: SERVICE_ROLE
      warehouse: RLI_DEV_WH
      database: PROD_ANALYTICS
      schema: STAGING
      threads: 4
