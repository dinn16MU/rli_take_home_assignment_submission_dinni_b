version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: stg_policies
    columns:
      - name: policy_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: policy_type
        data_tests:
          - accepted_values:
              values: ['Auto', 'Property', 'Liability', 'Marine', 'Workers Comp']

  - name: stg_claims
    columns:
      - name: claim_id
        data_tests: [unique, not_null]
      - name: policy_id
        data_tests:
          - relationships:
              to: ref('stg_policies')
              field: policy_id
      - name: claim_status
        data_tests:
          - accepted_values:
              values: ['Open', 'Pending', 'Closed']

  - name: stg_payments
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: policy_id
        data_tests:
          - relationships:
              to: ref('stg_policies')
              field: policy_id

  - name: stg_endorsements
    columns:
      - name: endorsement_id
        data_tests: [unique, not_null]
      - name: endorsement_type
        data_tests:
          - accepted_values:
              values: ['Coverage Increase', 'Coverage Reduction', 'Cancellation']
